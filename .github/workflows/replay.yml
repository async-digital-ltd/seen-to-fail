name: Replay a plant

# The automatic half: a job plants a declared defect, watches what the check
# does, and records one run per break through the same recorder a person's run
# goes through. Nothing is typed in and no verdict is guessed at. "The same
# recorder" is checkable rather than a turn of phrase: `pnpm ledger:replay` and
# the hand route's `pnpm ledger:record` are two entry scripts that both write
# through `recordRun` in packages/server/src/ledger/record.ts, so a rule one of
# them is held to is a rule the other is held to.
#
# What grades a replay is pinned in one place, .github/replay-requirements.txt:
# on 4 October 2026, canfail 0.2.1 with didrun 0.1.6 and restore-verified
# 0.1.4, each by version and by the hashes of its archives (#143). Change them
# there, not here; the file says how.
#
# On a schedule, and never on a push. Each replay runs a check once on a clean
# tree and once per declared break, so a dispatch that replays every declared
# check runs one more command per check than that check has breaks. Which
# checks and how many breaks is `canfail.json`'s to say and is not restated
# here; the scheduled lane runs only the checks that are due, which is usually
# fewer. While the repository was private, Actions minutes were a
# finite allowance and that was a second reason; it lapsed when the repository
# was made public on 27 September 2026. The reason that stands is the cost to
# the record: a replay is a dated observation, and running one on every merge
# would file a near identical proof several times a day, each against a
# different commit and so each a separate row, burying the runs that say
# something under runs that say the same thing again. That is an argument
# against a per-push cadence rather than against a cadence, and the one chosen
# here is weekly.
#
# The arithmetic, measured rather than estimated, and re-measured on 22
# September 2026 across every replay this repository had on record that day
# rather than across the one it had when this comment was first written. Four
# replay jobs had completed here by then: 35429662430 took 58 seconds,
# 35431432957 took 36, 35437095049 took 43, and the scheduled 35585966476 took
# 72. Actions bills a job rounded up to the whole minute, so that is one billed
# minute each for the first three and two for the last. Weekly is about 4.3
# runs a month, so five to nine billed minutes a month at those durations.
#
# Every one of those four replayed `ci-type-check` alone, because it was the
# only check declared when they ran. The checks #110 declared cost a run of
# the build or of the validator per break, and the job now starts a
# PostgreSQL service for the build. Before any runner had replayed them, the
# one figure was from a development machine on 27 September 2026, where a
# full run of every break declared that day, seven breaks and eleven commands
# in all, took 9 seconds of wall clock. The first replay to select them, the
# scheduled 36412371539 on 28 September 2026, ran the same seven breaks on a
# runner: its replay step took 18 seconds, and the whole job 64, starting the
# PostgreSQL service included.
#
# Two bounds were set against the machine-local figure, both before any runner
# had replayed those checks. Each check in `canfail.json` declares a `timeout`
# in seconds, which canfail applies to every run of that check: 120 for the
# type check and for each build, 60 for the validator, against runs that took
# about a second each on that machine and, for the type check, well under a
# minute on every runner that had replayed it by then. A run that overruns is
# killed by canfail and scored `look`, which the adapter records as a run that
# settled nothing, so a build whose database connection never settles becomes
# a recorded outcome rather than a job killed with nothing written. canfail's
# own default is 900 seconds, and at that default one hung build would have
# spent fifteen of the twenty minutes this job used to have. The job's
# `timeout-minutes` below is sized above the worst case of every declared run
# overrunning at once, plus the setup around them. That sum was nineteen
# minutes as declared on 27 September 2026, against a timeout of twenty-five.
# The break #141 added took it to twenty-one. The workflow lint and the server
# start, declared on 4 October 2026 with a timeout of 120 and two breaks each
# (#190, #146), take it to thirty-three, so the timeout is now forty. The
# script break #200 added to the workflow lint takes it to thirty-five, which
# forty still clears. A plant
# added later adds its check's timeout to that sum, so adding one means
# checking the job's timeout still clears it.
#
# What fraction of the allowance that is, this comment does not say. The
# organisation is on the `team` plan, which `gh api /orgs/async-digital-ltd
# --jq .plan.name` will confirm, and reading the minutes that plan includes
# needs the organisation billing API and an `admin:org` scope nothing here
# holds. An unread number is not a measurement, and the choice below does not
# turn on one: it turns on the ratio between weekly and daily, which is measured
# above.
#
# Daily would be about thirty runs a month for a record whose inputs change a
# few times a week, and it would queue up to thirty branches a month for a
# person to open a pull request on, which is the handoff #74 ruled on and the
# real bound on how often this can usefully run.
#
# Weekly against the thirty-day backstop is the other half of the choice. The
# backstop is what voids a proof when no replay arrives, so a cadence has to sit
# well inside it or it does nothing the backstop was not already doing: at
# monthly, something a check depends on could change the day after a run and the
# check would be Stale before the next run ever looked. A weekly run that
# arrives notices a change within seven days, which leaves twenty-three days of
# margin, and a run the scheduler drops is what the backstop is there for.
#
# The schedule does refresh a proof that is merely old, and that is a reversal.
# #68 ruled the opposite and this header said so: only a change to something a
# check declared could post a run, so a check nothing had touched went Stale at
# thirty days and waited for somebody to dispatch this by hand. The consequence
# is what overturned it. Once the repository goes quiet nothing changes, so
# nothing is ever selected, so every proof ages out on the backstop with no
# automatic route back, and epic #62's goal clause, that a check stays Proven
# for as long as it keeps catching that defect, is false. Measured on 19 September
# 2026, every check carrying a proof was due to read Stale within about four
# weeks.
#
# So a check is also selected when its newest settled run is older than an age
# floor, `REPLAY_AFTER_DAYS` in packages/server/src/staleness.ts, which is
# fourteen days. Fourteen is chosen against this cadence and that backstop: a
# check crosses the floor on day fourteen, the next weekly dispatch is at most
# day twenty-one, and the one after it is day twenty-eight, so the schedule gets
# two attempts at a refresh before the backstop bites on day thirty-one. A
# faster floor would file the near identical runs this header objects to above;
# a slower one would not survive GitHub dropping a scheduled run.
#
# It costs nothing extra to bill. The floor adds no dispatch, since the schedule
# fires weekly either way, and Actions bills a job rounded up to the minute, so
# a dispatch is one billed minute whether it replays or stops at the selection.
# The five to nine billed minutes a month measured above are still the ceiling.
#
# The floor cannot rescue a check with no plant in `canfail.json`, because that
# file is the whole of what the selection reads checks from. The dispatch below
# cannot reach such a check either, since it hands the same declaration to the
# tool and the record step refuses a check the declaration does not declare.
# Every check that carries a run has a plant there: `ci-type-check` from the
# start, the three published-record checks since #110, before which their
# only runs were typed in through the `Record a run` workflow and nothing could
# refresh them, and the workflow lint and the server start since #190 and
# #146, which gave each its record and its plant in one change. A check that
# carries an observation and no run reads Unproven
# and has no proof for a floor to keep alive; a plant for it is written by a
# person, and nothing here writes one.
#
# The floor keeps a proof alive only while two other things hold, and neither is
# its doing. A person has to merge the branch each replay pushes, because the
# ledger's newest settled run does not move until then and the page reads Stale
# from day thirty-one regardless of how many branches are waiting. And the
# schedule has to stay enabled: in a public repository GitHub disables scheduled
# workflows after sixty days without repository activity, recorded on #111.
#
# The replay is NOT added to the CI workflow that runs on every pull request.
# canfail edits real source files on disk and restores them afterwards, which is
# fine on a runner nobody else is using and is not something to put in the path
# of every contributor's change.
on:
  schedule:
    # Mondays, 04:17 UTC. Off the hour because the top of the hour is where
    # everybody else's scheduled runs are, and that bought less than it looks
    # like it should: the first scheduled run, 35585966476, was created at
    # 09:55:38 UTC on Monday 21 September 2026, five hours and thirty-eight
    # minutes after the time asked for. A cron is a request GitHub queues, not a
    # start time. What this reliably buys is about one run a week; the hour and
    # the minute are a preference. This comment keeps no count of the scheduled
    # runs, because a count here reads as current a week after it is written;
    # `gh run list --workflow replay.yml --event schedule` lists them.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      only-due:
        description: Replay only the checks that are due, as the schedule does.
        type: boolean
        default: false

# Only what it needs. The job pushes a branch and never opens a pull request, so
# `pull-requests: write` would be a permission nothing here uses. See the last
# step for why opening one is not attempted.
permissions:
  contents: write

jobs:
  replay:
    name: Replay the declared plants and record what happened
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # The commit the plants are applied to, which is what a replay records as
      # the tree it ran against. On workflow_dispatch this is the head of the
      # ref that was dispatched. It is deliberately not taken from a
      # pull_request event, where the sha is a synthetic merge commit that
      # exists only for the run and is not the tree anybody planted anything in.
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: replay/${{ github.run_id }}
      # The two databases .env.example names, pointed at the service container
      # below, the same shape as CI. Every declared check whose `run` is the
      # build needs one: the build derives every status in a database and
      # refuses to run without it. Both variables are read here. The step that
      # creates the databases creates both, and the build reads the first. The
      # server start check needs both set as well: the entry point refuses to
      # load without them, though its two probes reach neither database.
      DATABASE_URL: postgresql://seen_to_fail:seen_to_fail@localhost:5432/seen_to_fail_dev
      TEST_DATABASE_URL: postgresql://seen_to_fail:seen_to_fail@localhost:5432/seen_to_fail_test

    services:
      # The same service CI uses, for the same reason: the build is a
      # derivation through PostgreSQL, not a file transformation, and
      # `canfail.json` declares plants whose `run` is the build. It starts
      # with the job whether or not those checks turn out to be due, because
      # a service cannot be conditional on a step's output; the steps that
      # create and migrate the databases can be, and are.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seen_to_fail
          POSTGRES_PASSWORD: seen_to_fail
          POSTGRES_DB: seen_to_fail_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seen_to_fail -d seen_to_fail_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # With the whole history, because the selection below asks what has
      # changed since the commit each check was last replayed against, and that
      # commit is usually weeks behind. A shallow clone holds one, so every
      # recorded commit would be unreachable, every check would fall back to
      # comparing against the empty tree, and every check with a list would be
      # replayed on every run. The script refuses a shallow clone outright
      # rather than answering that, so this is what keeps the step passing as
      # well as what keeps it truthful.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Which checks are due, and the step that decides whether anything below
      # it runs at all. Ahead of Python and of the replay tool on purpose: the
      # whole point of asking is to spend nothing when the answer is nothing.
      #
      # Due means either of two things: something the check declares it depends
      # on changed (#68), or its newest settled run is older than the age floor.
      #
      # Three statuses, each meaning something different here. 0 is work to do,
      # and the declaration naming it is written under RUNNER_TEMP. 3 is nothing
      # to do, which is a green job with no output rather than a failure.
      # Anything else is a refusal, and it stops the run with nothing written. A
      # step that looked for the output file instead could not tell a refusal
      # from an honest empty answer, which is the distinction this whole
      # repository is about.
      - name: Work out which checks are due
        id: select
        env:
          # A dispatch replays every declared check unless it is asked not to.
          # That is the behaviour this workflow had before the schedule existed,
          # and it is still the route to a declared check wanted back sooner
          # than the floor would bring it. It reaches nothing outside
          # canfail.json: a check with no plant there is recorded by hand
          # through the `Record a run` workflow, not here.
          MATCHING: ${{ github.event_name == 'schedule' || inputs.only-due }}
        run: |
          set -euo pipefail
          if [ "$MATCHING" != 'true' ]; then
            echo "Every declared check will be replayed."
            echo "config=canfail.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          pnpm replay:select -- \
            --config canfail.json \
            --out "$RUNNER_TEMP/canfail-due.json" || status=$?
          if [ "$status" -eq 3 ]; then
            {
              echo "## Nothing to replay"
              echo
              echo "Nothing a declared check depends on has changed since that check was last replayed, and no declared check's proof has aged past the floor."
              echo "No plant was applied and nothing was recorded."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "The selection refused, so nothing was replayed." >&2
            exit 1
          fi
          echo "config=$RUNNER_TEMP/canfail-due.json" >> "$GITHUB_OUTPUT"

      # The database the build derives into, created and migrated the way CI
      # does it and only once something is due. Every declared check gets the
      # same runner state whichever of them was selected: a build-based check
      # replayed alone and one replayed beside the type check are then the same
      # replay, which is what makes two of its runs comparable.
      - name: Create the databases
        if: steps.select.outputs.config != ''
        run: node packages/server/src/scripts/create-databases.ts

      - name: Apply migrations
        if: steps.select.outputs.config != ''
        run: pnpm db:migrate

      - name: Install Python
        if: steps.select.outputs.config != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pinned to the version #66 adopted and measured, with the two packages
      # its verdicts rest on, by version and by hash, in
      # .github/replay-requirements.txt (#143). That file is the one place to
      # change them, and says how. canfail alone used to be pinned, and it
      # asks for its two dependencies with a floor and no ceiling. An unpinned
      # install would let the scoring change under a ledger that cannot yet
      # see which version produced a verdict, which is the staleness condition
      # epic #62 names and the reason the tool field is worth having.
      # --require-hashes installs nothing the file does not name with a hash.
      - name: Install the replay tool
        if: steps.select.outputs.config != ''
        run: pip install --require-hashes -r .github/replay-requirements.txt

      # canfail exits 1 when any guard was blind or failed the wrong way, and 0
      # when every declared break was caught OR every one of them settled
      # nothing. Both of those are results to record rather than reasons to
      # fail, and neither can be told from the other by the status: the two
      # halves this story exists to observe were measured on this branch and
      # both exited 0. Only exit 2, which is canfail saying it could not run at
      # all, fails this job.
      #
      # Nothing downstream reads this number. The per-break verdicts come from
      # the JSON document, which is the rule #66 pinned.
      #
      # The report is written under RUNNER_TEMP rather than into the checkout,
      # so that the tree is either clean after canfail has run or canfail failed
      # to put something back, which is what the step below reads. RUNNER_TEMP
      # is an ordinary environment variable on the runner; the `runner` context
      # it mirrors is not available in a job level `env` block, so spelling it
      # here is what makes the path resolve rather than expanding to nothing.
      #
      # The declaration it is handed is the one the step above chose, which on
      # the scheduled lane holds only the checks that are due and sits under
      # RUNNER_TEMP. Every break inside it still names its file relative to the
      # checkout, which is what `--cwd` is for: where the declaration lives and
      # where the files it breaks live are two different questions.
      - name: Replay the declared plants
        if: steps.select.outputs.config != ''
        env:
          CANFAIL_CONFIG: ${{ steps.select.outputs.config }}
        run: |
          set -euo pipefail
          status=0
          canfail --cwd "$GITHUB_WORKSPACE" --json "$CANFAIL_CONFIG" > "$RUNNER_TEMP/canfail-report.json" || status=$?
          echo "canfail exited $status."
          if [ "$status" -ge 2 ]; then
            echo "canfail could not run. Nothing was replayed." >&2
            exit 1
          fi

      # canfail breaks real files and puts them back, and a restore that ran is
      # not a restore that worked. A tree that did not come back has an unknown
      # baseline for every break after the one that failed, so its later
      # verdicts are about a tree nobody declared. Written as an `if` rather
      # than as a negated command, because `set -e` does not apply to a command
      # whose status is inverted with `!`. The status is assigned to a variable
      # before it is tested, because `set -e` does not apply to a command
      # substitution inside the arguments to `[` either: written inline, a git
      # that failed, on an unreadable index for one, gave an empty string and
      # the step passed (#222). Untracked files are listed one by one, so a
      # plant that leaves a new file behind is named in the failure.
      - name: Check the tree came back
        if: steps.select.outputs.config != ''
        run: |
          set -euo pipefail
          tree_status=$(git status --porcelain --untracked-files=all)
          if [ -n "$tree_status" ]; then
            echo "The working tree did not come back after the replay:" >&2
            printf '%s\n' "$tree_status" >&2
            exit 1
          fi

      # The gate. A verdict this mapping does not recognise, a check the
      # declaration does not declare, or a record that breaks a ledger rule
      # stops here with nothing written, so the steps below have nothing to
      # commit. So does an undeclared break, a missing one, or one break twice.
      # Every value it reads comes through the environment rather than being
      # substituted into the text of this script.
      #
      # The whole declaration, not the one the selection chose. The addresses a
      # report is recorded against are the same either way, and reading them
      # from the file that is committed keeps this step's behaviour independent
      # of which lane picked the plants.
      - name: Record what the replay found
        if: steps.select.outputs.config != ''
        run: |
          pnpm ledger:replay -- \
            --report "$RUNNER_TEMP/canfail-report.json" \
            --config canfail.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-run-url "$SOURCE_RUN_URL"

      # The same command CI runs and the recording workflow runs, so this job
      # cannot commit a ledger either of them would have refused.
      - name: Check the whole ledger still reads
        if: steps.select.outputs.config != ''
        run: pnpm ledger:validate

      # Push the branch, exit 0, and tell a person what is waiting.
      #
      # This job does not open the pull request, and that is the route ruled on
      # #74 rather than a limitation worked around. "Allow GitHub Actions to
      # create and approve pull requests" is off on this repository, and GitHub
      # couples create and approve behind that one switch: turning it on to let
      # a job open a pull request also lets automation approve one, in a
      # repository whose whole subject is whether automated checks can be
      # trusted. Measured on 2026-09-18, a job that tried it went red with the
      # record already committed and pushed, and a red run here is designed to
      # mean nothing landed, so a person reading the red correctly would have
      # lost a real recorded run.
      #
      # So the handoff is the designed behaviour and it is stated in the run
      # summary rather than buried in a failed step's log. The green means
      # recorded and waiting for a person. It does not mean done.
      - name: Push the record and say what is waiting
        if: steps.select.outputs.config != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add ledger
          if git diff --cached --quiet; then
            echo "Every run in this replay was already recorded. Nothing to commit."
            {
              echo "## Nothing new to record"
              echo
              echo "Every run this replay produced was already in the ledger, byte for byte."
              echo "No branch was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit --message "Record a replay of the declared plants, from run $GITHUB_RUN_ID"
          git push origin "$BRANCH"
          {
            echo "## Recorded, and waiting for a person"
            echo
            echo "The replay ran and its runs are committed on \`$BRANCH\`."
            echo "They are NOT in the ledger yet. Nothing reaches the published record until this branch is merged."
            echo
            echo "Open the pull request with the lines below, after setting TICKET to the issue this replay evidences."
            echo "The pull request title becomes the merged commit's subject, and the number in it is the only record"
            echo "of which ticket the merge served (#116). The title reads TICKET in a form the shell refuses while it"
            echo "is empty, so the command does not run at all until a number is set."
            echo
            echo '```sh'
            echo 'TICKET='
            echo "gh pr create --base main --head $BRANCH \\"
            echo "  --title \"Record a replay from run $GITHUB_RUN_ID (#\${TICKET:?set TICKET to the issue this replay evidences})\" \\"
            echo "  --body 'Recorded by the Replay a plant workflow, run $GITHUB_RUN_ID.'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
