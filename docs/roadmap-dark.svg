<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="t">
  <title id="t">Version 1, a record kept by hand, joined by a line to Later, plants that replay themselves</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #9da7b3; }
    .title { font-size: 18px; font-weight: 600; fill: #e6edf3; }
    .body { font-size: 14px; fill: #9da7b3; }
  </style>
  <line x1="30" y1="28" x2="388" y2="28" stroke="#e6edf3" stroke-width="4"/>
  <circle cx="30" cy="28" r="14" fill="#e6edf3"/>
  <circle cx="400" cy="28" r="12" fill="none" stroke="#e6edf3" stroke-width="4"/>
  <text class="label" x="16" y="76">VERSION 1 · NOW</text>
  <text class="title" x="16" y="102">A record kept by hand</text>
  <text class="body" x="16" y="128">You plant the defect, watch the check,</text>
  <text class="body" x="16" y="148">and write down what happened in a form.</text>
  <text class="label" x="386" y="76">LATER</text>
  <text class="title" x="386" y="102">Plants that replay themselves</text>
  <text class="body" x="386" y="128">Each check keeps its planted defect as a file.</text>
  <text class="body" x="386" y="148">It is replayed whenever something the check</text>
  <text class="body" x="386" y="168">depends on changes, and the result is posted</text>
  <text class="body" x="386" y="188">without anyone typing it in.</text>
</svg>
