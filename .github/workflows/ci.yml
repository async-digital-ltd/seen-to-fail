name: CI

# Every push to main and every pull request. That is what the README badge
# reports on.
#
# The ci-control lane is the third trigger and it is deliberate. This project
# exists to record whether a check has ever been seen to catch a planted
# defect, and a workflow that has only ever been green is exactly the thing it
# refuses to trust. Keeping the lane in the shipped file means the control can
# be re-armed at any time without editing this file first, so what gets proved
# is the workflow that actually runs on main. To use it: branch, plant the
# defect, push under ci-control/, read the conclusion, delete the branch.
on:
  push:
    branches:
      - main
      - 'ci-control/**'
  pull_request:

# A newer push to the same branch makes the older run's answer stale, so the
# older run is cancelled rather than left to finish and report on code nobody
# is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type check, lint, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The two databases .env.example names, pointed at the service container
    # below. The config module requires both to be set and refuses to start
    # without either, so both are here even though only the second is read by
    # the tests. There is no .env in CI and none is written: these are the
    # whole configuration.
    env:
      DATABASE_URL: postgresql://seen_to_fail:seen_to_fail@localhost:5432/seen_to_fail_dev
      TEST_DATABASE_URL: postgresql://seen_to_fail:seen_to_fail@localhost:5432/seen_to_fail_test

    services:
      # docker-compose.yml is not read here. It is the local route; CI gets its
      # own PostgreSQL 16 as a service container, configured to match the
      # credentials in .env.example so the URLs above are the same shape a
      # contributor uses. The steps run on the runner rather than inside a
      # container, so the port mapping is what makes localhost:5432 reach it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seen_to_fail
          POSTGRES_PASSWORD: seen_to_fail
          POSTGRES_DB: seen_to_fail_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seen_to_fail -d seen_to_fail_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # With the whole history, because the published ledger says which commit
      # recorded each run and that is read back out of the log. A shallow clone
      # holds one commit, so every run would say it was never recorded, and
      # nothing about that page would look wrong. The build refuses a shallow
      # clone outright rather than publishing it, so this is what keeps the
      # step passing as well as what keeps it truthful.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Ahead of Node, because the Node step's dependency cache is a pnpm store
      # and it needs pnpm on the PATH to find where that store lives. The
      # version comes from the packageManager field in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Frozen, so a lockfile that does not match package.json fails here
      # rather than quietly installing something else.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The server's resolver types and the web client's typed queries are both
      # generated from schema.graphql and checked in, so they drift the moment
      # somebody edits the schema or a query without running the generator, and
      # nothing about a stale file looks wrong when you read it. Regenerating
      # here and refusing a difference is what makes the committed files a
      # statement about the schema being served rather than about the schema as
      # it was at some point. A query naming a field the schema does not have
      # fails here too, because generating validates every query first.
      # `pnpm codegen` is the fix for a failure here; it is the same command
      # this step runs before comparing.
      - name: Check the generated types are current
        run: pnpm codegen:check

      # The image creates POSTGRES_DB and nothing else, so the test database is
      # added by the same script a local `pnpm db:up` runs. It also waits for
      # the server to accept a connection, which the health check above has
      # already established but which costs nothing to confirm.
      - name: Create the databases
        run: node packages/server/src/scripts/create-databases.ts

      - name: Apply migrations
        run: pnpm db:migrate

      # The commands docs/tests.md tells a contributor to run, in the order it
      # lists them, through the same root scripts. CI cannot pass something
      # a local run fails, because there is only one definition of each check.
      # That list is written from the run lines between the two steps either
      # side, and its list of CI's steps from every name in this job, so a
      # change here needs `pnpm readme` before the tests pass. The list moved
      # there from the README's Tests section when the README was split (#251).
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Every file in .github/workflows, this one included, read as a workflow
      # by actionlint and the shell in its run steps by shellcheck, both at
      # versions pinned by checksum in the script. It is here because two of
      # the three workflows only run when dispatched or on the schedule, so
      # this is the only place a mistake in them can fail before it matters
      # (#157). The script's header says what is pinned and why.
      #
      # The same script then runs that pinned shellcheck over every tracked
      # shell script under scripts/. Several steps of this job are one of those
      # scripts, and actionlint reads only the shell written inside a workflow,
      # so nothing else lints them (#191).
      - name: Lint the workflows
        run: pnpm lint:workflows

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # The tests answer requests through the handler and never run the entry
      # point, so without this step nothing in the build would notice the
      # server failing to load. It starts `pnpm dev:server` against the
      # development database above, waits a bounded time for `/health` and one
      # GraphQL query to answer, and stops it again. A script rather than lines
      # here, so a local run is the same check (#35).
      - name: Check the server starts
        run: bash scripts/check-server-starts.sh

      # The client's entry is index.html, and the tests reach the code through
      # modules, never through the page. Bundling is what proves the page
      # resolves its script, and that the whole client compiles for a browser
      # rather than only for the type checker.
      - name: Build the client
        run: pnpm build:web

      # What that build wrote, in bytes, held to the baseline committed in
      # packages/web/bundle-baseline.json (#246). Bytes rather than a timed
      # page load, because the same lockfile and source build the same bytes
      # on any runner, so this goes red for a change in the code and never for
      # a slow machine. It fails when the JavaScript, the CSS or the whole
      # build grows past the baseline's tolerance. When one shrinks it passes
      # and says to run `pnpm bundle:ratchet`, which can only lower the
      # baseline; raising it is a hand edit, so growth arrives in a diff with
      # its reason beside it.
      - name: Check the client bundle against its baseline
        run: pnpm bundle:check

      # The same command the recording workflow runs before it commits, so CI
      # cannot pass a ledger that workflow would have refused.
      - name: Check the ledger reads
        run: pnpm ledger:validate

      # The published output. It is built whenever this workflow runs: every
      # push to main, every push to a ci-control branch, and every pull
      # request. That is the trigger block at the top of this file rather than
      # a daily cadence. There is no cron here and this comment used to claim
      # one.
      #
      # Only a push to main is served, by the publish job at the foot of this
      # file (#76). Every other run keeps the page as an artefact and nothing
      # more, so a pull request or a ci-control plant can never change what a
      # reader sees. Pages stayed off until the repository was made public,
      # because a Pages site cannot be private on this plan and the page would
      # have been world-readable ahead of that decision.
      #
      # It loads the records into the development database, which is emptied
      # and rebuilt from them. In CI that database is a service container with
      # nothing else in it.
      - name: Build the published ledger
        run: pnpm ledger:build

      # What the build produced, read back off disk rather than trusted. The
      # build has already refused to publish anything that disagrees with the
      # record; these are the properties a reader can check without reading
      # the build: two files exist, the page names the commit it was built
      # from, and it carries no script, so nothing on it is worked out anywhere
      # but here.
      #
      # A script rather than lines in this file, because the replay runs the
      # same check against the plant `canfail.json` declares for it (#110), and
      # a copy of these lines there would be a second definition of the check.
      # The script's header holds the history of the `! grep` line that could
      # not fail.
      - name: Check the published output
        run: bash scripts/check-published-output.sh

      - name: Keep the published ledger as an artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-ledger
          path: dist/ledger
          retention-days: 7

      # The same directory again, packed the way Pages reads it. Only on a
      # push to main, so this is the only run whose page the publish job
      # below can pick up. It comes after the output check, so a page that
      # failed that check never reaches this step.
      - name: Hand the published ledger to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/ledger

  # Serves the page the checks job built and checked on this same commit. It
  # never builds anything itself, so what is served is exactly what passed.
  # It runs only after that job succeeds, and only for a push to main.
  #
  # The workflow's concurrency group applies here too, so a newer push to
  # main cancels a publish still in flight and the newer page is the one
  # served. Nothing is lost by that: the newer commit carries every record
  # the older one did.
  publish:
    name: Publish the ledger
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
