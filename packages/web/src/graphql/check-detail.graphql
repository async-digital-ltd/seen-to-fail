query CheckDetail($id: ID!) {
  check(id: $id) {
    id
    name
    area
    protects
    howToTellArmed
    status
    lastCaughtOn
    lastSettledOn
    runCount
    caughtCount
    missedCount
    inconclusiveCount
    runs {
      id
      runOn
      planted
      expected
      outcome
      inconclusiveReason
      note
      source
      sourceCommit
      sourceRunUrl
    }
    armingObservations {
      id
      observedOn
      armed
      note
    }
  }
}
