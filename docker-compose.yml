# PostgreSQL 16 for local development, with a separate database for tests.
# The README links the verification run. Regular CI uses a service container.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seen_to_fail
      POSTGRES_PASSWORD: seen_to_fail
      POSTGRES_DB: seen_to_fail_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, on an empty data directory, to add the test database.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seen_to_fail -d seen_to_fail_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
