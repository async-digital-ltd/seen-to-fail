name: Record a run

# The write path for version 2: a run is recorded by committing it, so a record
# that is wrong has an author, a diff and a revert. No service runs and no
# token can write the ledger, because what is published is a static page built
# from committed records.
#
# It pushes a branch rather than pushing to main. main is protected here and
# that is the point rather than an obstacle: a recorded run arrives as a diff
# somebody can read, which is the property the publishing route was chosen for.
#
# It does not open the pull request, and that is the route ruled on #74 rather
# than a limitation worked around. "Allow GitHub Actions to create and approve
# pull requests" is off on this repository, and GitHub couples create and
# approve behind that one switch: turning it on to let a job open a pull
# request also lets automation approve one, in a repository whose whole subject
# is whether automated checks can be trusted. Measured on 2026-09-18, run
# 35405970369 of this workflow tried it and went red with the record already
# committed and pushed, and a red run here is designed to mean nothing landed,
# so a person reading the red correctly would have lost a real recorded run.
#
# So the handoff is the designed behaviour, the same one `Replay a plant` has,
# and the last step states it in the run summary rather than burying it in a
# failed step's log. The green means recorded and waiting for a person. It does
# not mean done. A person opens the pull request from the pushed branch with
# the command the summary prints, and its required check then starts on its
# own, as it did on #79. Whether the person in that loop is ever replaced is
# what #74 still asks.
on:
  workflow_dispatch:
    inputs:
      check-id:
        description: The check's id in the ledger, such as ci-lint.
        required: true
        type: string
      run-on:
        description: The day the defect was planted, as YYYY-MM-DD in UTC. A day after today in UTC is refused.
        required: true
        type: string
      planted:
        description: What was planted.
        required: true
        type: string
      expected:
        description: What the check was expected to do about it.
        required: true
        type: string
      outcome:
        description: What it actually did.
        required: true
        type: choice
        options:
          - caught
          - missed
          - inconclusive
      inconclusive-reason:
        description: >-
          Why it settled nothing. Required when the outcome is inconclusive,
          and refused otherwise.
        required: false
        type: string
      note:
        description: Anything the next person should know.
        required: false
        type: string

# Only what it needs. The job pushes a branch and never opens a pull request, so
# `pull-requests: write` would be a permission nothing here uses. The header
# says why opening one is not attempted.
permissions:
  contents: write

jobs:
  record:
    name: Record a run in the ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every input is passed through the environment rather than interpolated
      # into the script. A value substituted into the text of a run step is
      # executed as shell, and these values come from whoever started the
      # workflow.
      #
      # This step is the gate: a record that breaks a rule is refused here, the
      # step exits non-zero, and no file is written for the steps below to
      # commit.
      #
      # The source is hand and is written here rather than offered as an input.
      # Somebody starting this workflow and typing what they saw is the hand
      # route however it is started, and a replay posting its own result is a
      # different path with a commit and a run link to carry: that is #67.
      - name: Write the run into the ledger
        env:
          INPUT_CHECK_ID: ${{ inputs.check_id }}
          INPUT_RUN_ON: ${{ inputs.run-on }}
          INPUT_PLANTED: ${{ inputs.planted }}
          INPUT_EXPECTED: ${{ inputs.expected }}
          INPUT_OUTCOME: ${{ inputs.outcome }}
          INPUT_REASON: ${{ inputs.inconclusive-reason }}
          INPUT_NOTE: ${{ inputs.note }}
        # The reason is passed whatever the outcome, and an empty one reads as
        # none, exactly as the note does. Which outcomes need a reason is the
        # reader's rule, and a second copy of it in this shell would be a place
        # for the two to disagree: a run that settled nothing and was given no
        # reason is refused by the step rather than recorded without one.
        #
        # The four free-text values are joined to their flags with `=`. Passed
        # as a separate word, a value that starts with a dash is read by the
        # recorder's argument parser as the next option, so a planted text such
        # as `-Werror was removed` was refused with a stack trace before any
        # ledger rule saw it (#152). Joined, it is recorded exactly as typed.
        run: |
          pnpm ledger:record -- \
            --check-id "$INPUT_CHECK_ID" \
            --run-on "$INPUT_RUN_ON" \
            --planted="$INPUT_PLANTED" \
            --expected="$INPUT_EXPECTED" \
            --outcome "$INPUT_OUTCOME" \
            --inconclusive-reason="$INPUT_REASON" \
            --source hand \
            --note="$INPUT_NOTE"

      # The record that was just written is sound, or the step above would have
      # refused it. This reads the whole ledger, which is the thing the build
      # will read, so a ledger that was already wrong is found here rather than
      # after another record has been added on top of it.
      - name: Check the whole ledger still reads
        run: pnpm ledger:validate

      # Push the branch, exit 0, and tell a person what is waiting. The header
      # says why this job does not open the pull request itself.
      #
      # The check id, the date and the outcome are printed into the command
      # below only after the recording step accepted them: the id names a check
      # the ledger holds, the date is a date and the outcome is one of three
      # words, so none of them can break the quoting a person pastes.
      - name: Push the record and say what is waiting
        env:
          INPUT_CHECK_ID: ${{ inputs.check-id }}
          INPUT_RUN_ON: ${{ inputs.run-on }}
          INPUT_OUTCOME: ${{ inputs.outcome }}
          BRANCH: record/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add ledger
          if git diff --cached --quiet; then
            echo "This run is already recorded. Nothing to commit."
            {
              echo "## Nothing new to record"
              echo
              echo "This run was already in the ledger, byte for byte."
              echo "No branch was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Worded so that all three outcomes fit the sentence. "a caught"
          # and "a inconclusive" cannot both be written the same way round.
          git commit --message "Record a run for $INPUT_CHECK_ID on $INPUT_RUN_ON: $INPUT_OUTCOME"
          git push origin "$BRANCH"
          {
            echo "## Recorded, and waiting for a person"
            echo
            echo "The run is committed on \`$BRANCH\`."
            echo "It is NOT in the ledger yet. Nothing reaches the published record until this branch is merged."
            echo
            echo "Open the pull request with the lines below, after setting TICKET to the issue this run evidences."
            echo "The pull request title becomes the merged commit's subject, and the number in it is the only record"
            echo "of which ticket the merge served (#174). The title reads TICKET in a form the shell refuses while it"
            echo "is empty, so the command does not run at all until a number is set."
            echo
            echo '```sh'
            echo 'TICKET='
            echo "gh pr create --base main --head $BRANCH \\"
            echo "  --title 'Record a run for $INPUT_CHECK_ID on $INPUT_RUN_ON: $INPUT_OUTCOME'\" (#\${TICKET:?set TICKET to the issue this run evidences})\" \\"
            echo "  --body 'Recorded by the Record a run workflow, run $GITHUB_RUN_ID.'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
