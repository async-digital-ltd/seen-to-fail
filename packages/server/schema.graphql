# The contract between the API and everything that reads it.
#
# This file is the schema rather than a printout of one. The resolvers are typed
# from it by graphql-codegen, and the generated types are checked in, so a field
# added here and left unresolved is a type error before it is a runtime
# surprise. The build regenerates the types and fails if what is checked in
# differs, which is what stops this file and the code drifting apart.
#
# Every description below is shown in GraphiQL, so they are written for somebody
# reading the API rather than for somebody reading this file.

"""
A calendar day, written as YYYY-MM-DD, from 0001-01-01 on.

Days are days in this product, not instants. A run is dated and never timed, so
the scalar carries a day and refuses anything that is not one rather than
accepting a timestamp and quietly dropping the part it cannot use.
"""
scalar Date

"""
The five statuses a check can hold.

A status is worked out from the record as of a day, and no table stores one, so
these are the readings a check can give rather than states it can be put into.
"""
enum Status {
  "The latest run caught its planted defect, recently enough to still believe."
  PROVEN
  "There is evidence it is switched on, and nothing has ever been planted for it."
  UNPROVEN
  "It caught a planted defect before, but longer ago than the threshold."
  STALE
  "There is no evidence it is switched on at all."
  UNARMED
  "The latest run missed the defect that was planted for it."
  BROKEN
}

"What a check did with the defect that was planted for it."
enum Outcome {
  "It reported the planted defect, which is the only thing that proves it works."
  CAUGHT
  "The defect was planted and the check said nothing."
  MISSED
}

"""
One planted defect, and what the check did about it.

A run is the unit of evidence in this product. Everything a check's status
claims is read off these.
"""
type TestRun {
  id: ID!
  "The day the defect was planted, which may be before it was written down."
  runOn: Date!
  "What was planted."
  planted: String!
  "What the check was expected to do about it."
  expected: String!
  "What it actually did."
  outcome: Outcome!
  "Anything worth telling the next person. Null when nobody wrote one."
  note: String
}

"""
Evidence, on one day, about whether a check is switched on at all.

Kept apart from a test run because the two answer different questions. A check
can be switched on and never proved, or proved and since switched off.
"""
type ArmingObservation {
  id: ID!
  "The day somebody looked."
  observedOn: Date!
  "What they found."
  armed: Boolean!
  note: String
}

"""
An automated check: one thing that is supposed to catch something.

The summary fields below are a reading of the check's record as of today, not
columns on a row. Two calls on either side of midnight can differ without
anything having been written.
"""
type Check {
  id: ID!
  name: String!
  "Where the check runs, in the team's own words."
  area: String!
  "What it is there to stop. Empty when nobody has written it down."
  protects: String!
  "How a reader can tell it is switched on. Empty when not written down."
  howToTellArmed: String!
  "The status derived from everything below, as of today."
  status: Status!
  "The last day a run caught, or null when none ever has."
  lastCaughtOn: Date
  "The day of the latest run, or null when there are none."
  lastRunOn: Date
  runCount: Int!
  caughtCount: Int!
  missedCount: Int!
  "The last day an observation said it was on, or null if none has."
  lastSeenArmedOn: Date
  """
  What the latest observation said, or null when there has never been one.
  Null is "nobody has looked" and false is "somebody looked and it was off",
  which are different things to show a reader.
  """
  lastArmed: Boolean
  "Every run against this check, newest first."
  runs: [TestRun!]!
  "Every observation about this check, newest first."
  armingObservations: [ArmingObservation!]!
}

"""
How many checks hold each status, as of today.

The five counts add up to the total, because a check holds exactly one status.
"""
type StatusCounts {
  proven: Int!
  unproven: Int!
  stale: Int!
  unarmed: Int!
  broken: Int!
  total: Int!
}

"""
A filter over the list of checks, written as JSON in the filter language.

The shape is the filter package's own: either { "kind": "empty" }, or
{ "kind": "groups", "joiner": "and", "groups": [...] } where each group is
{ "joiner": "or", "conditions": [...] }. A status inside a condition is spelled
the way the filter language spells it, such as "Proven", rather than the way the
Status enum is.

It is a JSON scalar rather than a set of input types because the language is
already defined, validated and tested in one place. Restating it here would be a
second definition to keep in step with the first, and the two would drift.
"""
scalar FilterInput

"""
The checks a filter selects, and how many it leaves out.

Both counts are read in the same statement as the list, so they describe the
same workspace as the checks beside them.
"""
type CheckList {
  "The checks the filter selects, ordered by name."
  checks: [Check!]!
  "How many checks the filter selects."
  matching: Int!
  "How many checks the filter leaves out. With matching, this is every check."
  hidden: Int!
}

type Query {
  """
  The checks a filter selects, ordered by name, with how many it hides.

  With no filter, or a null one, every check is listed and none is hidden.

  A filter the language cannot express is refused before anything is read. The
  error's extensions carry an errors list, one entry per bad node, each with the
  path to that node, such as groups[1].conditions[0].days, and a message.
  """
  checks(filter: FilterInput): CheckList!
  "One check, or null when nothing is recorded under that id."
  check(id: ID!): Check
  """
  How many checks hold each status.

  Always the whole workspace, whatever the list is filtered by, so the counts
  show the whole picture beside a list that may be showing part of it.
  """
  statusCounts: StatusCounts!
}

"A new check, as somebody would describe it in a form."
input CreateCheckInput {
  "Unique across the workspace, and not blank."
  name: String!
  "Where the check runs, in the team's own words. Not blank."
  area: String!
  "What it is there to stop. Not blank."
  protects: String!
  "How a reader can tell it is switched on. Not blank."
  howToTellArmed: String!
}

"One planted defect, and what the check did about it."
input LogTestRunInput {
  "The check the defect was planted for. It has to exist."
  checkId: ID!
  "The day the defect was planted. Not in the future."
  runOn: Date!
  "What was planted. Not blank."
  planted: String!
  "What the check was expected to do about it. Not blank."
  expected: String!
  "What it actually did."
  outcome: Outcome!
  "Anything worth telling the next person. A blank note is stored as none."
  note: String
}

"Evidence, on one day, about whether a check is switched on."
input RecordArmingObservationInput {
  "The check that was looked at. It has to exist."
  checkId: ID!
  "The day somebody looked. Not in the future."
  observedOn: Date!
  "What they found."
  armed: Boolean!
  "Anything worth telling the next person. A blank note is stored as none."
  note: String
}

"""
One field of an input that was refused, and why.

Meant to be shown beside the field it names.
"""
type FieldError {
  "The input field at fault, named as the input names it, such as runOn."
  path: String!
  "What is wrong with it, written for the person who filled it in."
  message: String!
}

"""
Why an input was refused. Nothing was written.

The rules that can be judged from the input alone are judged together, and every
field that breaks one is listed, once, with the first rule it breaks. The rules
only the database can judge, a name already in use, a check that does not exist
and a day after the database's own today, are judged as the row is written. So
one of those is only found once every other rule has passed, and is listed on
its own.
"""
type ValidationErrors {
  errors: [FieldError!]!
}

"The check that was created, or why nothing was."
union CheckResult = Check | ValidationErrors

"A run that was logged, with the check it was logged against."
type TestRunLogged {
  testRun: TestRun!
  "The check as it reads now, with the new run counted in its status."
  check: Check!
}

"The run that was logged, or why nothing was."
union TestRunResult = TestRunLogged | ValidationErrors

"An observation that was recorded, with the check it was about."
type ArmingObservationRecorded {
  armingObservation: ArmingObservation!
  "The check as it reads now, with the new observation counted in its status."
  check: Check!
}

"The observation that was recorded, or why nothing was."
union ArmingObservationResult = ArmingObservationRecorded | ValidationErrors

# The three ways the record grows. Rows are only ever added: nothing here edits
# or deletes a check, a run or an observation, because the record is a history
# of what was seen and when.
#
# An input that breaks a rule is answered with ValidationErrors in the data, and
# nothing is written. That is a union rather than a GraphQL error because a form
# refusing what somebody typed is an expected answer, and a union is what the
# client's generated types can see. The shape of an input, such as a missing
# required field or a Date that is not a day, is still refused by GraphQL itself
# before any rule is applied; the client's generated types stop a form sending
# one of those in the first place.
#
# The prose is kept in this comment rather than in a description on the type,
# because the generator copies a type's description onto every argument type it
# derives from it.
type Mutation {
  """
  Adds a check, which reads Unarmed until a run or an observation is recorded
  against it. A field that is blank, too long or holds a character that cannot
  be saved is refused on that field, and a name already in use on name.
  """
  createCheck(input: CreateCheckInput!): CheckResult!
  """
  Logs a test run. A field that is blank, too long or holds a character that
  cannot be saved is refused on that field, an unknown check on checkId, and a
  day after today on runOn.
  """
  logTestRun(input: LogTestRunInput!): TestRunResult!
  """
  Records an arming observation. A note that is too long or holds a character
  that cannot be saved is refused on note, an unknown check on checkId, and a
  day after today on observedOn.
  """
  recordArmingObservation(
    input: RecordArmingObservationInput!
  ): ArmingObservationResult!
}
